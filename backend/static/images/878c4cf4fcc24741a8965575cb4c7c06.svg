<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d1b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3b491;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leggingsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shirtGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ca1af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shadowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="540" rx="250" ry="15" fill="url(#shadowGradient)" />

  <!-- Alignment Guidelines (Instructional Style) -->
  <g stroke="#d1d8e0" stroke-width="1" stroke-dasharray="5,5">
    <line x1="150" y1="230" x2="650" y2="230" /> <!-- Arm level -->
    <line x1="550" y1="230" x2="550" y2="530" /> <!-- Front knee/ankle vertical -->
    <line x1="220" y1="530" x2="550" y2="530" /> <!-- Floor alignment -->
  </g>

  <!-- Back Leg (Left) -->
  <path d="M400 380 L230 515 L200 530 L250 535 L245 510 Z" fill="url(#leggingsGradient)" />
  <path d="M200 530 L220 540 L260 535 L250 530 Z" fill="url(#skinGradient)" />

  <!-- Front Leg (Right) -->
  <path d="M400 380 L550 380 L560 510 L550 530 L530 510 Z" fill="url(#leggingsGradient)" />
  <path d="M530 530 L580 530 L575 540 L535 540 Z" fill="url(#skinGradient)" />

  <!-- Torso -->
  <path d="M385 230 Q400 220 415 230 L425 380 Q400 395 375 380 Z" fill="url(#shirtGradient)" />
  
  <!-- Back Arm (Left) -->
  <path d="M385 240 L180 230 L180 250 L385 265 Z" fill="url(#skinGradient)" filter="url(#softShadow)" />
  
  <!-- Front Arm (Right) -->
  <path d="M415 240 L620 230 L620 250 L415 265 Z" fill="url(#skinGradient)" filter="url(#softShadow)" />

  <!-- Head and Neck -->
  <rect x="393" y="210" width="14" height="25" fill="url(#skinGradient)" />
  <g transform="translate(400, 180) rotate(5)">
    <ellipse cx="15" cy="0" rx="22" ry="28" fill="url(#skinGradient)" />
    <!-- Hair/Details -->
    <path d="M-5 -25 Q15 -35 35 -20 Q30 -10 35 0 L10 5 Z" fill="#2c3e50" />
    <!-- Gaze Direction (Instructional Arrow) -->
    <path d="M35 0 L60 0" stroke="#4ca1af" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ca1af" />
    </marker>
  </defs>

  <!-- Instruction Callouts -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#576574">
    <text x="570" y="370">Knee over ankle</text>
    <text x="130" y="220">Arms parallel</text>
    <text x="350" y="140">Spine tall &amp; centered</text>
    <circle cx="550" cy="380" r="4" fill="#4ca1af" />
    <circle cx="550" cy="530" r="4" fill="#4ca1af" />
    <circle cx="400" cy="230" r="4" fill="#4ca1af" />
  </g>

  <!-- Highlight details on skin for definition -->
  <path d="M545 385 Q550 450 555 520" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />
  <path d="M400 240 L600 235" stroke="rgba(255,255,255,0.1)" stroke-width="3" fill="none" />
</svg>