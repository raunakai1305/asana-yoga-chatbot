<svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fce0c6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4c29e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g filter="url(#shadow)">
    <!-- Yoga Mat -->
    <rect x="150" y="620" width="200" height="15" rx="5" fill="#e0e0e0" />
    
    <!-- Padahastasana Pose -->
    <g transform="translate(250, 450)">
      <!-- Legs -->
      <path d="M-20,0 L-20,150 M20,0 L20,150" stroke="#4a4a4a" stroke-width="12" stroke-linecap="round" />
      
      <!-- Torso curved down -->
      <path d="M-20,0 C-20,-80 20,-80 20,0" fill="url(#skin)" stroke="#d1a585" stroke-width="2" />
      
      <!-- Head -->
      <circle cx="0" cy="-100" r="30" fill="url(#skin)" />
      
      <!-- Arms reaching for feet -->
      <path d="M-15,10 L-30,130 M15,10 L30,130" stroke="#d1a585" stroke-width="14" stroke-linecap="round" />
      
      <!-- Feet/Hands connection -->
      <ellipse cx="-30" cy="140" rx="15" ry="10" fill="#f4c29e" />
      <ellipse cx="30" cy="140" rx="15" ry="10" fill="#f4c29e" />
    </g>
  </g>

  <!-- Instructional Markers -->
  <line x1="200" y1="350" x2="150" y2="300" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="140" y="290" font-family="Arial" font-size="14" fill="#333" text-anchor="end">Keep legs straight</text>
  
  <line x1="280" y1="580" x2="350" y2="550" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="360" y="550" font-family="Arial" font-size="14" fill="#333">Hands under feet</text>
  
  <text x="250" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2c3e50" text-anchor="middle">Padahastasana</text>
  <text x="250" y="80" font-family="sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">Standing Forward Bend</text>
</svg>