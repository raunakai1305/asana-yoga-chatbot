<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd5b4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b894;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leggingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48c6ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6f86d6;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#ffffff" />

  <!-- Floor Shadow -->
  <ellipse cx="400" cy="720" rx="250" ry="20" fill="#f0f0f0" />

  <!-- Alignment Guidelines (Instructional Style) -->
  <line x1="150" y1="710" x2="650" y2="710" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="8,4" />
  <path d="M 530,150 L 530,710" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Body Group -->
  <g filter="url(#softShadow)">
    
    <!-- Back Leg (Left) -->
    <path d="M 330,450 L 200,695 L 160,710 L 220,710 L 350,470 Z" fill="url(#leggingGrad)" />
    <!-- Back Foot Detail -->
    <path d="M 160,710 Q 155,705 160,700 L 200,695 L 220,710 Z" fill="#e8b894" />

    <!-- Front Leg (Right) -->
    <path d="M 400,450 L 530,695 L 530,710 L 580,710 L 580,705 L 450,450 Z" fill="url(#leggingGrad)" />
    <!-- Front Foot Detail -->
    <path d="M 530,710 L 580,710 L 585,705 L 530,695 Z" fill="#fcd5b4" />

    <!-- Pelvis/Hips -->
    <path d="M 315,440 Q 370,410 450,450 L 400,500 L 330,480 Z" fill="url(#leggingGrad)" />

    <!-- Torso (Tilted) -->
    <path d="M 315,440 L 480,280 Q 520,240 550,280 L 450,450 Z" fill="url(#topGrad)" />

    <!-- Bottom Arm (Reaching Down) -->
    <path d="M 480,280 L 535,460 L 555,620 L 535,635 L 515,620 L 500,450 Z" fill="url(#skinGrad)" />
    <!-- Hand on Shin/Block -->
    <path d="M 535,635 Q 545,645 530,660 L 520,655 Z" fill="url(#skinGrad)" />

    <!-- Top Arm (Reaching Up) -->
    <path d="M 530,270 L 510,100 L 535,90 L 555,250 Z" fill="url(#skinGrad)" />
    <!-- Hand reaching up -->
    <path d="M 510,100 Q 500,80 520,70 L 535,90 Z" fill="url(#skinGrad)" />

    <!-- Neck and Head -->
    <g transform="translate(545, 265) rotate(-35)">
      <!-- Neck -->
      <path d="M -10,0 L 10,0 L 8,15 L -8,15 Z" fill="url(#skinGrad)" />
      <!-- Head -->
      <ellipse cx="0" cy="-25" rx="22" ry="30" fill="url(#skinGrad)" />
      <!-- Hair/Detail -->
      <path d="M -22,-30 Q 0,-60 22,-30 L 20,-10 Q 0,-5 -20,-10 Z" fill="#3d2b1f" />
    </g>

    <!-- Instructional Highlights: Straight Line Axis -->
    <line x1="522" y1="80" x2="540" y2="650" stroke="#48c6ef" stroke-width="2" stroke-dasharray="5,5" opacity="0.6" />
    
  </g>

  <!-- Labels/Callouts -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
    <text x="560" y="80">Extend fingertips upward</text>
    <text x="590" y="705">Front foot points forward</text>
    <text x="100" y="705">Back foot 45°</text>
    <text x="440" y="220">Keep chest open</text>
    <circle cx="530" cy="710" r="4" fill="#48c6ef" />
    <circle cx="190" cy="710" r="4" fill="#48c6ef" />
  </g>

  <!-- Pose Name -->
  <text x="400" y="770" font-family="Georgia, serif" font-size="28" fill="#2c3e50" text-anchor="middle" font-weight="bold">TRIKONASANA</text>
  <text x="400" y="790" font-family="Arial, sans-serif" font-size="12" fill="#95a5a6" text-anchor="middle">TRIANGLE POSE</text>
</svg>