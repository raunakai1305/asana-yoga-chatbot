# Appium server
appium.server.url=http://127.0.0.1:4723

# Device
device.name=Pixel 6
platform.version=14
# Set to the connected device UDID: adb devices
device.udid=emulator-5554

# App — path relative to project root, or absolute
# Build with: cd android && ./gradlew assembleDebug
app.path=../app/build/outputs/apk/debug/app-debug.apk
app.package=com.asana.app
app.activity=com.asana.app.MainActivity

# Test tuning
wait.timeout.seconds=20
splash.duration.seconds=4
